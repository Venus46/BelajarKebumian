<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background-color: #111;
            padding: 20px 40px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #fff;
            margin: 0;
        }
        
        .header-nav {
            display: flex;
            gap: 30px;
        }
        
        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .header-nav a:hover {
            color: #888;
        }
        
        .content-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        .content-container h2 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #fff;
        }
        
        .button-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 60px;
        }
        
        .button-section a {
            display: block;
            padding: 20px 40px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            border-radius: 15px;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .button-section a:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
        
        .button-section a:active {
            transform: translateY(0);
        }
        
        .about-section {
            margin-top: 40px;
        }
        
        .about-section h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .about-section p {
            font-size: 16px;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 15px;
        }
        
        .about-section a {
            color: #6a9fff;
            text-decoration: none;
        }
        
        .about-section a:hover {
            text-decoration: underline;
        }
        
        .about-columns {
            display: flex;
            gap: 60px;
            margin-top: 20px;
        }
        
        .about-left, .about-right {
            flex: 1;
        }
        
        .about-left h4, .about-right h4 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .contact-item img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        
        .contact-item span {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Site Title</h1>
        <nav class="header-nav">
            <a href="index.html">Home</a>
            <a href="tools.html">Tools</a>
        </nav>
    </div>
    
    <div class="content-container">
        <h2>Header</h2>
        
        <div class="button-section">
            <a href="#">Page 1</a>
            <a href="#">Page 2</a>
        </div>
        
        <div class="about-section">
            <h3>About</h3>
            
            <div class="about-columns">
                <div class="about-left">
                    <h4>Made by</h4>
                    <p>Creator Name</p>
                    
                    <h4 style="margin-top: 30px;">Contact</h4>
                    <div class="contact-info">
                        <div class="contact-item">
                            <img src="email.jpg" alt="Email">
                            <span>myemail@something.com</span>
                        </div>
                        <div class="contact-item">
                            <img src="whatsapp.jpg" alt="WhatsApp">
                            <span>mynumber</span>
                        </div>
                    </div>
                </div>
                
                <div class="about-right">
                    <h4>Support me</h4>
                    <p>- Support 1</p>
                    <p>- Support 2</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
