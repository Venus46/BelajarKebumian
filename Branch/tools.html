<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Belajar Kebumian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #111;
            padding: 20px 40px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #fff;
            margin: 0;
        }
        
        .header-nav {
            display: flex;
            gap: 30px;
        }
        
        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .header-nav a:hover {
            color: #888;
        }
        
        .content-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        
        .construction-text {
            font-size: 48px;
            color: #fff;
            margin-bottom: 20px;
        }

        .sub-text {
            font-size: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Belajar Kebumian</h1>
        <nav class="header-nav">
            <a href="index.html">Home</a>
            <a href="tools.html">Tools</a>
        </nav>
    </div>
    
    <div class="content-container">
        <h2 class="construction-text">Oops!</h2>
        <p class="sub-text">This part is still under construction.</p>
    </div>
</body>
</html>
