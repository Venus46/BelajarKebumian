<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Ilmu Kebumian</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background-color: #111;
            padding: 20px 40px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #fff;
            margin: 0;
        }
        
        .header-nav {
            display: flex;
            gap: 30px;
        }
        
        .header-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }
        
        .header-nav a:hover {
            color: #888;
        }
        
        .content-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 40px;
        }
        
        .content-container h2 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 40px;
        }
        
        .button-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .button-section a {
            display: block;
            padding: 20px 40px;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            border-radius: 15px;
            text-align: center;
            transition: background-color 0.3s, transform 0.2s;
        }
        
        .button-section a:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
        
        .button-section a:active {
            transform: translateY(0);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #6a9fff;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Belajar Kebumian</h1>
        <nav class="header-nav">
            <!-- Using ../ to go up one folder back to the root directory -->
            <a href="../index.html">Home</a>
            <a href="../tools.html">Tools</a>
        </nav>
    </div>
    
    <div class="content-container">

            <a href="subbidang/Astronomi.html">Astronomi</a>
        </div>

        <a href="../index.html" class="back-link">← Kembali ke Halaman Utama</a>
    </div>
</body>
</html>
